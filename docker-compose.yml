version: '3.8'

services:
  # ─── PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: delivero-postgres
    restart: always
    environment:
      POSTGRES_USER: delivero_user
      POSTGRES_PASSWORD: delivero_secure_password
      POSTGRES_DB: delivero_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delivero_user -d delivero_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API Service ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivero-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://delivero_user:delivero_secure_password@postgres:5432/delivero_db?schema=public
      JWT_SECRET: delivero_production_jwt_secret_key_9876543210_change_in_prod
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Frontend Nginx Reverse Proxy & Static SPA ───────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivero-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  postgres_data:
